version: '3.9'

services:
  backend:
    container_name: backend-test
    build:
      context: ..
      dockerfile: tests/Dockerfile
    image: backend-test
    ports:
      - "8080:8080"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
    stop_signal: SIGTERM
    networks:
      - test-network
    env_file:
      - .env

  postgres-shard-0:
    image: postgres:16.6-alpine3.21
    restart: always
    container_name: ${PG_SHARD_0}
    hostname: ${PG_SHARD_0}
    networks:
      - test-network
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${DB}
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-shard-1:
    image: postgres:16.6-alpine3.21
    restart: always
    container_name: ${PG_SHARD_1}
    hostname: ${PG_SHARD_1}
    networks:
      - test-network
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${DB}
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: migrate-test
    networks:
      - test-network
    volumes:
      - ../internal/migrations:/migrations
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      for shard in $${PG_SHARD_0} $${PG_SHARD_1}; do
        echo 'Running migrations for' $shard &&
        migrate -path=/migrations -database=postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${shard}:5432/$${DB}?sslmode=disable up
      done
      "
    env_file:
      - .env

networks:
  test-network:
